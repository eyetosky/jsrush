# JS Rush Production Nginx Configuration

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=game_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=payment_limit:10m rate=2r/s;

# Upstream backend
upstream jsrush_backend {
    server app:5000;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name jsrush.com www.jsrush.com;

    # Allow certbot challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jsrush.com www.jsrush.com;

    # SSL Configuration (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/jsrush.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jsrush.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.whish.money https://whish.money https://cdn.ravenjs.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.whish.money https://whish.money https://lb.sandbox.whish.money wss://jsrush.com;" always;

    # Client max body size
    client_max_body_size 10M;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Static files
    location /static/ {
        alias /app/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media uploads
    location /uploads/ {
        alias /app/static/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        # Prevent direct access to sensitive uploads
        location ~* \.(php|py|sh|exe)$ {
            deny all;
        }
    }

    # API endpoints with rate limiting
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        
        # Stricter limits for auth endpoints
        location ~ ^/api/(auth|login|register|verify|password|2fa) {
            limit_req zone=auth_limit burst=5 nodelay;
        }

        # Payment endpoints
        location ~ ^/api/(deposit|withdraw|payment|whish) {
            limit_req zone=payment_limit burst=5 nodelay;
        }

        # Game endpoints
        location ~ ^/api/(game|play|bet|slots|blackjack|roulette|dice|crash|mines|craps|videopoker|bingo|barakat|electronic) {
            limit_req zone=game_limit burst=30 nodelay;
        }

        proxy_pass http://jsrush_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Admin panel - restrict access
    location /admin/ {
        # Allow only specific IPs (configure your admin IPs)
        # allow 192.168.1.0/24;
        # allow 10.0.0.0/8;
        # deny all;
        
        limit_req zone=auth_limit burst=10 nodelay;
        
        proxy_pass http://jsrush_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # WebSocket endpoint
    location /ws/ {
        proxy_pass http://jsrush_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeouts
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Health check (no rate limiting)
    location /health {
        proxy_pass http://jsrush_backend;
        access_log off;
    }

    # Robots.txt
    location /robots.txt {
        proxy_pass http://jsrush_backend;
        access_log off;
    }

    # Main application
    location / {
        proxy_pass http://jsrush_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /404.html {
        root /app/static;
        internal;
    }
    
    location = /50x.html {
        root /app/static;
        internal;
    }
}